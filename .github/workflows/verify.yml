name: Verify Pi compatibility

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm test

  exact-versions:
    name: Pi ${{ matrix.pi-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["0.84.4", "0.85.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact Pi packages
        run: |
          npm install --ignore-scripts --no-package-lock --no-save \
            "@earendil-works/pi-coding-agent@${{ matrix.pi-version }}" \
            "@earendil-works/pi-ai@${{ matrix.pi-version }}" \
            "@earendil-works/pi-agent-core@${{ matrix.pi-version }}"
      - name: Verify exact Pi package versions
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          for (const name of [
            "@earendil-works/pi-coding-agent",
            "@earendil-works/pi-ai",
            "@earendil-works/pi-agent-core",
          ]) {
            const installed = JSON.parse(
              readFileSync(`node_modules/${name}/package.json`, "utf8"),
            ).version;
            if (installed !== process.env.PI_VERSION) {
              throw new Error(`${name}: expected ${process.env.PI_VERSION}, installed ${installed}`);
            }
          }
          NODE
      - run: npm test
